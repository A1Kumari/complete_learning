<svg xmlns="http://www.w3.org/2000/svg" width="420" height="510" viewBox="0 0 420 510" role="img" aria-labelledby="title desc">
  <title id="title">Encoder roles and output choices</title>
  <desc id="desc">An input passes through an encoder to a representation. That representation can feed a classifier for a label, or a decoder for reconstruction or generation.</desc>
  <rect width="420" height="510" rx="16" fill="#f4f7ff"/>
  <g fill="#e3edff" stroke="#3964a5" stroke-width="2">
    <rect x="30" y="20" width="360" height="58" rx="10"/>
    <rect x="30" y="115" width="360" height="58" rx="10"/>
    <rect x="30" y="210" width="360" height="58" rx="10"/>
    <rect x="15" y="330" width="180" height="58" rx="10"/>
    <rect x="225" y="330" width="180" height="58" rx="10"/>
    <rect x="15" y="430" width="180" height="58" rx="10"/>
    <rect x="225" y="430" width="180" height="58" rx="10"/>
  </g>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#152c50">
    <text x="210" y="55">Input: text / image / audio</text>
    <text x="210" y="150">Encoder</text>
    <text x="210" y="245">Representation z or source states</text>
    <text x="105" y="365">Classification head</text>
    <text x="315" y="365">Decoder</text>
    <text x="105" y="465">Label / scores</text>
    <text x="315" y="453">Reconstruction</text>
    <text x="315" y="477">or generation</text>
  </g>
  <g stroke="#3964a5" stroke-width="3" fill="none">
    <path d="M210 79v34m-7-9 7 9 7-9M210 174v34m-7-9 7 9 7-9"/>
    <path d="M210 269v30H105v29m-7-9 7 9 7-9M210 299h105v29m-7-9 7 9 7-9"/>
    <path d="M105 389v39m-7-9 7 9 7-9M315 389v39m-7-9 7 9 7-9"/>
  </g>
</svg>
