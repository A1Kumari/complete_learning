<svg xmlns="http://www.w3.org/2000/svg" width="420" height="590" viewBox="0 0 420 590" role="img" aria-labelledby="title desc">
  <title id="title">CNN feature hierarchy</title>
  <desc id="desc">Image to shared local filters, feature maps, activation and normalization, optional downsampling, deeper features, and task head.</desc>
  <rect width="420" height="590" rx="16" fill="#f4f7ff"/>
  <g fill="#e3edff" stroke="#3964a5" stroke-width="2">
    <rect x="30" y="16" width="360" height="56" rx="10"/>
    <rect x="30" y="98" width="360" height="56" rx="10"/>
    <rect x="30" y="180" width="360" height="56" rx="10"/>
    <rect x="30" y="262" width="360" height="56" rx="10"/>
    <rect x="30" y="344" width="360" height="56" rx="10"/>
    <rect x="30" y="426" width="360" height="56" rx="10"/>
    <rect x="30" y="508" width="360" height="56" rx="10"/>
  </g>
  <g fill="#152c50" font-family="sans-serif" font-size="20" text-anchor="middle">
    <text x="210" y="50">Image: H × W × channels</text>
    <text x="210" y="132">Shared local filters</text>
    <text x="210" y="214">Feature maps</text>
    <text x="210" y="296">Activation / normalization</text>
    <text x="210" y="378">Optional pooling or stride</text>
    <text x="210" y="460">Deeper feature maps</text>
    <text x="210" y="542">Classifier or task head</text>
  </g>
