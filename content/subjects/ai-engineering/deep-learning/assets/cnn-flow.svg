    <path d="M208 319h4v15h6l-8 9-8-9h6z"/>
    <path d="M208 401h4v15h6l-8 9-8-9h6z"/>
    <path d="M208 483h4v15h6l-8 9-8-9h6z"/>
  </g>
</svg>
