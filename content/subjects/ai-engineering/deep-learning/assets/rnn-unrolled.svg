<svg xmlns="http://www.w3.org/2000/svg" width="420" height="550" viewBox="0 0 420 550" role="img" aria-labelledby="title desc">
  <title id="title">An RNN unrolled over three inputs</title>
  <desc id="desc">Initial state h0 flows down through h1, h2 and h3. Each update also receives its respective input x1, x2 or x3 from the left. h3 feeds an output head. All updates reuse weights.</desc>
  <rect width="420" height="550" rx="16" fill="#f4f7ff"/>
  <g fill="#e3edff" stroke="#3964a5" stroke-width="2">
    <rect x="185" y="20" width="200" height="52" rx="10"/>
    <rect x="185" y="122" width="200" height="52" rx="10"/>
    <rect x="185" y="224" width="200" height="52" rx="10"/>
    <rect x="185" y="326" width="200" height="52" rx="10"/>
    <rect x="185" y="428" width="200" height="52" rx="10"/>
    <rect x="15" y="122" width="110" height="52" rx="10"/>
    <rect x="15" y="224" width="110" height="52" rx="10"/>
    <rect x="15" y="326" width="110" height="52" rx="10"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#152c50" text-anchor="middle">
    <text x="285" y="53">Initial state h0</text>
    <text x="285" y="155">State h1</text>
    <text x="285" y="257">State h2</text>
    <text x="285" y="359">State h3</text>
    <text x="285" y="461">Output head</text>
    <text x="70" y="155">Input x1</text>
    <text x="70" y="257">Input x2</text>
    <text x="70" y="359">Input x3</text>
    <text x="210" y="520">Same weights at every update</text>
  </g>
  <g fill="#3964a5">
    <path d="M283 73h4v37h6l-8 10-8-10h6z"/>
    <path d="M283 175h4v37h6l-8 10-8-10h6z"/>
    <path d="M283 277h4v37h6l-8 10-8-10h6z"/>
    <path d="M283 379h4v37h6l-8 10-8-10h6z"/>
    <path d="M126 146h45v-6l12 8-12 8v-6h-45z"/>
    <path d="M126 248h45v-6l12 8-12 8v-6h-45z"/>
    <path d="M126 350h45v-6l12 8-12 8v-6h-45z"/>
  </g>
</svg>
